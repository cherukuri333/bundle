bundle:
  name: sample-python-bundle-dev
  description: Deploy a PySpark script to Databricks (Dev Environment)

artifacts:
  main:
    type: workspace-files
    path: ./src
    destination: /Workspace/dev/sample-python

tasks:
  run-script-dev:
    type: python-wheels
    package_name: sample_python_script
    entry_point: main
    cluster:
      new:
        num_workers: 1
        spark_version: 11.3.x-scala2.12
        node_type_id: i3.large
        autoscale:
          min_workers: 1
          max_workers: 2

permissions:
  - group: users
    level: CAN_RUN

workspace:
  host: https://dbc-19dd5697-db5b.cloud.databricks.com
